<title>2종 철도법 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 한 열짜리 학습 앱. 위에 고정 탭, 가운데 학습 카드 하나, 아래로 해설 */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --ink: #15202B;
  --muted: #5B6875;
  --line: #D5DCE4;
  --accent: #1B5FAA;
  --accent-soft: #E1EBF7;
  --good: #1D7A4C;
  --good-soft: #DFF2E8;
  --bad: #C2182B;
  --bad-soft: #FBE3E6;
  --warn: #A86400;
  --warn-soft: #FBEFD9;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --surface: #18202A; --ink: #E6ECF2; --muted: #95A3B1; --line: #2A3542;
    --accent: #78AEFF; --accent-soft: #1C2D45; --good: #4CC38A; --good-soft: #15322A;
    --bad: #FF7A7A; --bad-soft: #3A1D22; --warn: #F2B04C; --warn-soft: #3A2C14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --surface: #18202A; --ink: #E6ECF2; --muted: #95A3B1; --line: #2A3542;
  --accent: #78AEFF; --accent-soft: #1C2D45; --good: #4CC38A; --good-soft: #15322A;
  --bad: #FF7A7A; --bad-soft: #3A1D22; --warn: #F2B04C; --warn-soft: #3A2C14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; padding-block: 12px 6px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; letter-spacing: 0.01em; margin: 0; }
.today { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 0 8px; }
nav.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 0.82rem; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }

.panel { padding-block: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.ref { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 0.82rem; color: var(--muted); }
.ref .law { font-weight: 700; color: var(--accent); }
.ref .no { font-family: var(--f-mono); color: var(--ink); }
.lamps { display: inline-flex; gap: 3px; margin-left: auto; }
.lamps i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.lamps i.on { background: var(--good); }
.lead { color: var(--muted); font-size: 0.88rem; border-left: 2px solid var(--line); padding-left: 10px; }
.q { font-size: 1.05rem; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 4.5em; text-align: center; border-bottom: 2px solid var(--accent); color: var(--accent); font-weight: 700; padding: 0 4px; }
.blank.ok { color: var(--good); border-color: var(--good); }
.blank.no { color: var(--bad); border-color: var(--bad); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 440px) { .choices { grid-template-columns: 1fr; } }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 13px; display: flex; gap: 10px; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.choice .k { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.ok { border-color: var(--good); background: var(--good-soft); }
.choice.no { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn.small { padding: 5px 10px; font-size: 0.82rem; }
.btn.wide { width: 100%; padding-block: 13px; font-size: 1rem; }
.hint { color: var(--muted); font-size: 0.8rem; }
details.full summary { color: var(--muted); font-size: 0.85rem; cursor: pointer; }
.arttext { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 7px; font-size: 0.95rem; word-break: keep-all; overflow-wrap: anywhere; }
.arttext p { margin: 0; }
.arttext p.sub { padding-left: 1.2em; }
.figwrap { display: block; overflow-x: auto; max-width: 100%; }
img.fig { display: block; max-width: none; height: auto; background: #FFFFFF; border: 1px solid var(--line); border-radius: 6px; padding: 4px; margin-block: 2px; }
b.key { color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; font-weight: 700; }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; }
.keys .lbl { color: var(--muted); }
.keys span.k { border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 1px 7px; font-weight: 600; }

.explain { border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.explain .out { white-space: pre-wrap; font-size: 0.93rem; word-break: keep-all; overflow-wrap: anywhere; }
.explain .out:empty { display: none; }

.progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.lessonhead { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.lessonhead .t { font-weight: 700; min-width: 0; }
.lessonhead .step { font-family: var(--f-mono); color: var(--muted); font-size: 0.8rem; }
.termface { display: grid; gap: 8px; padding-block: 6px; }
.termface .term { font-family: var(--f-display); font-size: 1.7rem; line-height: 1.25; }
.termface .def { font-size: 1rem; word-break: keep-all; overflow-wrap: anywhere; }

.intro ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.intro h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; }
.lawgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.lawgroup > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.lawgroup > summary::-webkit-details-marker { display: none; }
.lawgroup .name { font-weight: 700; }
.lawgroup .cnt { font-family: var(--f-mono); color: var(--muted); font-size: 0.8rem; }
.units { display: grid; padding: 0 8px 8px; }
.unit { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 10px 8px; }
.unit:hover { background: var(--bg); }
.unit .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.7rem; color: var(--bg); }
.unit .dot.done { background: var(--good); border-color: var(--good); }
.unit .dot.next { border-color: var(--accent); }
.unit .ut { font-weight: 600; font-size: 0.92rem; }
.unit .us { color: var(--muted); font-size: 0.78rem; overflow-wrap: anywhere; }
.unit .sc { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.tag { font-size: 0.7rem; font-weight: 700; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 4px; }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.item summary { display: flex; gap: 8px; align-items: center; cursor: pointer; list-style: none; flex-wrap: wrap; }
.item summary::-webkit-details-marker { display: none; }
.item .no { font-family: var(--f-mono); font-size: 0.85rem; }
.item .t { font-weight: 600; min-width: 0; }
.lawtag { font-size: 0.72rem; color: var(--accent); font-weight: 700; }

.stats { display: grid; gap: 12px; }
.lawstat { display: grid; gap: 6px; }
.lawstat .head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.9rem; }
.lawstat .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.8rem; }
.bar { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar .fill.pass { background: var(--good); }
.bar .fill.fail { background: var(--bad); }
.bar .cut { position: absolute; top: -2px; bottom: -2px; left: 60%; width: 2px; background: var(--ink); opacity: 0.55; }
.big { font-family: var(--f-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
.tile .lbl { font-size: 0.75rem; color: var(--muted); }
.weak { display: grid; gap: 6px; }
.weak .w { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 6px; font-size: 0.88rem; }
.w .cnt { font-family: var(--f-mono); color: var(--bad); font-size: 0.8rem; }
h2 { font-size: 1rem; margin: 0; }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; display: grid; gap: 12px; justify-items: center; }
.save { font-size: 0.75rem; color: var(--muted); padding-top: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .choice, .chip, .btn, .unit { transition: background-color .15s, border-color .15s; }
  .progress i { transition: width .25s; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>2종 철도법 암기장</h1>
      <div class="today" id="today">오늘 0문제</div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="true" data-tab="learn">배우기</button>
      <button role="tab" id="tab-quiz" aria-selected="false" data-tab="quiz">복습 퀴즈</button>
      <button role="tab" id="tab-browse" aria-selected="false" data-tab="browse">조문 찾기</button>
      <button role="tab" id="tab-stats" aria-selected="false" data-tab="stats">내 기록</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p-learn"><div class="card"><div class="empty">법령 원문을 불러오는 중입니다.</div></div></section>
  <section class="panel" id="p-quiz" hidden></section>
  <section class="panel" id="p-browse" hidden>
    <div class="chips" id="browse-chips"></div>
    <input class="search" id="q" type="search" placeholder="조문 번호, 제목, 내용 검색 (예: 제10조, 폐색, 과태료)" autocomplete="off">
    <div class="list" id="results"></div>
  </section>
  <section class="panel" id="p-stats" hidden></section>
  <div class="save" id="save"></div>
</main>

<script>
(function () {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const now = () => Date.now();
  const MIN = 60e3, DAY = 864e5;
  const INTERVAL = [2 * MIN, 10 * MIN, DAY, 3 * DAY, 7 * DAY, 16 * DAY];
  const LS_KEY = "rail2-progress-v1", LS_EXPL = "rail2-explain-v1";
  const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  // ---------- 진도 상태 ----------
  // arts[id] = {b: 외운 단계 0-5, d: 다음 복습 시각, r: 맞힘, w: 틀림, t: 마지막} — 조문과 용어 모두
  // units[id] = {d: 끝낸 시각, r: 맞힘, n: 문제 수}
  const blank = () => ({ v: 2, u: 0, arts: {}, units: {}, log: [], days: {}, laws: null, scope: "learned" });
  let S = blank();
  function adopt(x) { S = Object.assign(blank(), JSON.parse(JSON.stringify(x))); S.units = S.units || {}; S.v = 2; }
  try { const c = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (c && c.arts) adopt(c); } catch (e) {}
  function lsSet() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

  let DB = null, dbRef = null, saving = false, dirty = false, saveTimer = null;
  const note = () => (dbRef ? "기록이 내 계정에 저장됩니다." : "기록은 이 기기에만 저장됩니다.");
  function touch() {
    S.u = now();
    lsSet();
    if (!dbRef) return;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 1500);
  }
  async function flush() {
    if (!dbRef || saving || !dirty) return;
    saving = true; dirty = false;
    try { await dbRef.set(JSON.parse(JSON.stringify(S))); }
    catch (e) {
      if (e && ["invalid_argument", "revoked", "not_granted", "quota_exceeded"].includes(e.code)) { dbRef = null; $("#save").textContent = note(); }
      else dirty = true;
    }
    saving = false;
    if (dirty) saveTimer = setTimeout(flush, 3000);
  }
  async function connectDb() {
    $("#save").textContent = note();
    try {
      if (!window.claude || !window.claude.use) return;
      const user = await window.claude.use("user");
      if (!user || !(await user.isOwner())) return;
      const db = await window.claude.use("db");
      if (!db) return;
      DB = db;
      const ref = db.doc("progress/main");
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && remote.arts && (remote.u || 0) > (S.u || 0)) { adopt(remote); lsSet(); rerender(); }
      dbRef = ref;
      $("#save").textContent = note();
      if (!remote || (S.u || 0) > (remote.u || 0)) { dirty = true; flush(); }
    } catch (e) { /* 이 기기 저장으로 계속 */ }
  }

  // ---------- 데이터 ----------
  let FIG = {};
  const figs = (h) => h.replace(/\{\{그림:(\d+)\}\}/g, (m, n) => (FIG[n] ? '<span class="figwrap"><img class="fig" loading="lazy" src="' + FIG[n].src + '" alt="' + esc(FIG[n].alt) + '"></span>' : ""));
  const figText = (s) => s.replace(/\{\{그림:(\d+)\}\}/g, (m, n) => (FIG[n] ? "[표: " + FIG[n].alt.replace(/\s+/g, " ") + "]" : ""));
  let LAWS = [], LAWBY = {}, ARTS = [], BYID = {}, TERMS = [], UNITS = [], UNITBY = {}, COURSE = [];
  let active = new Set();

  // ---------- 외울 거리(빈칸 후보) ----------
  const NUM = /(?<![제\d,.])\d[\d,]*(?:\.\d+)?(?:\s?(?:억|천만|백만|만|천|백))*\s?(?:원|년|개월|일|시간|분(?!의)|초|킬로미터|미터|밀리미터|센티미터|퍼센트|%|점|명|회|세|배|량|톤|킬로그램|볼트|km\/h|㎞\/h)/g;
  const FRAC = /\d+분의\s?\d+/g;
  const CMP = ["이상", "이하", "초과", "미만"];
  const GROUPS = {
    ord: { w: 2, words: ["대통령령", "국토교통부령"], fake: ["총리령", "국토교통부 고시", "법률"] },
    auth: { w: 1, words: ["국토교통부장관", "시ㆍ도지사", "철도운영자등", "철도시설관리자", "한국교통안전공단", "도시철도운영자", "운전업무종사자", "관제사", "역장", "기관사", "전철차장", "운전취급담당자"] },
    block: { w: 3, words: ["자동폐색식", "차내신호폐색식", "연동폐색식", "통표폐색식", "지도통신식", "지도식", "전령법", "격시법", "통신식", "지령식", "차내폐색식"] },
    sig: { w: 3, words: ["정지신호", "경계신호", "주의신호", "감속신호", "진행신호", "유도신호", "입환신호"] },
    sigdev: { w: 3, words: ["장내신호기", "출발신호기", "폐색신호기", "엄호신호기", "유도신호기", "입환신호기", "원방신호기", "통과신호기", "중계신호기"] },
  };
  const WORD2GRP = {};
  Object.keys(GROUPS).forEach((g) => GROUPS[g].words.forEach((w) => (WORD2GRP[w] = g)));
  const WORDRE = new RegExp(Object.keys(WORD2GRP).sort((a, b) => b.length - a.length).join("|"), "g");
  const unitOf = (tok) => { const u = tok.replace(/[\d,.\s]/g, ""); return /원$/.test(u) ? "money" : u.replace(/^(억|천만|백만|만|천|백)+/, ""); };
  const NUMPOOL = {};
  function candidates(a) {
    if (a.cands) return a.cands;
    const out = [];
    a.lines.forEach((l, li) => {
      let m;
      NUM.lastIndex = 0;
      while ((m = NUM.exec(l))) {
        const tok = m[0];
        out.push({ li, s: m.index, e: m.index + tok.length, ans: tok, grp: "n:" + unitOf(tok), w: 3 });
        const c = l.slice(m.index + tok.length).match(/^\s?(이상|이하|초과|미만)/);
        if (c) { const s = m.index + tok.length + c[0].indexOf(c[1]); out.push({ li, s, e: s + c[1].length, ans: c[1], grp: "cmp", w: 2 }); }
      }
      FRAC.lastIndex = 0;
      while ((m = FRAC.exec(l))) out.push({ li, s: m.index, e: m.index + m[0].length, ans: m[0], grp: "frac", w: 3 });
      WORDRE.lastIndex = 0;

  function quizControls() {
    return '<div class="chips">' + LAWS.map((L2) => '<button class="chip" aria-pressed="' + active.has(L2.id) + '" data-law="' + L2.id + '">' + esc(L2.short) + "</button>").join("") + "</div>" +
      '<div class="chips"><button class="chip" aria-pressed="' + (S.scope !== "all") + '" data-scope="learned">배운 것만</button><button class="chip" aria-pressed="' + (S.scope === "all") + '" data-scope="all">전체 조문</button></div>';
  }
  function nextQuiz() {
    const items = quizItems();
    if (!items.length) {
      $("#p-quiz").innerHTML = quizControls() + '<div class="card"><div class="empty"><div>' + (S.scope !== "all" ? "아직 배운 조문이 없습니다. ‘배우기’에서 단원을 하나 끝내면 여기서 복습할 수 있습니다." : "고른 법령에 낼 문제가 없습니다.") + '</div><button class="btn primary" data-goto="learn">배우기로 가기</button></div></div>';
      return;
    }
    const it = forced && items.includes(forced) ? forced : pickDue(items, lastQ);
    forced = null;
    lastQ = it.id;
    if (it.kind === "term") Q = { it, opts: termChoices(it), picked: null };
    else { const c = pickCands(it, 1)[0]; Q = { it, c, opts: shuffle([c.ans].concat(distractors(c))), picked: null }; }
    renderQuiz();
  }
  function renderQuiz() {
    const due = quizItems().filter((x) => st(x.id) && st(x.id).d <= now()).length;
    $("#p-quiz").innerHTML = quizControls() + '<div class="hint">지금 복습할 것 ' + due + "개</div>" + '<div class="card">' +
      (Q.it.kind === "term" ? tqHtml(Q.it, Q.opts, Q.picked) : qHtml(Q.it, Q.c, Q.opts, Q.picked, false)) + "</div>";
    const n = $("#next"); if (n) n.focus({ preventScroll: true });
  }
  function quizAnswer(i) {
    if (!Q || Q.picked !== null) return;
    Q.picked = i;
    const ans = Q.it.kind === "term" ? Q.it.term : Q.c.ans;
    grade(Q.it.id, Q.opts[i] === ans ? "ok" : "no", "q", ans);
    renderQuiz();
  }
  $("#p-quiz").addEventListener("click", (e) => {
    const b = e.target.closest(".choice");
    if (b && !b.disabled) { quizAnswer(+b.dataset.i); return; }
    if (e.target.closest("#next")) { nextQuiz(); return; }
    const lw = e.target.closest("[data-law]");
    if (lw) { toggleLaw(lw.dataset.law); Q = null; nextQuiz(); return; }
    const sc = e.target.closest("[data-scope]");
    if (sc) { S.scope = sc.dataset.scope; touch(); Q = null; nextQuiz(); return; }
    if (e.target.closest("[data-goto]")) show("learn");
  });
  function toggleLaw(id) {
    if (active.has(id)) { if (active.size > 1) active.delete(id); } else active.add(id);
    S.laws = [...active];
    touch();
  }

  // ---------- 조문 찾기 ----------
  let browseLimit = 40;
  function renderBrowse() {
    $("#browse-chips").innerHTML = LAWS.map((L2) => '<button class="chip" aria-pressed="' + active.has(L2.id) + '" data-law="' + L2.id + '">' + esc(L2.short) + "</button>").join("");
    const q = $("#q").value.trim();
    const norm = (s) => s.replace(/\s+/g, "");
    const nq = norm(q);
    const pool = ARTS.filter((a) => active.has(a.law.id));
    const hits = !q ? pool : pool.filter((a) => norm(a.no + a.title).includes(nq) || a.lines.some((l) => norm(l).includes(nq)));
    const shown = hits.slice(0, browseLimit);
    const hl = (s) => { if (!q) return esc(s); const i = s.indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(q) + "</mark>" + esc(s.slice(i + q.length)); };
    $("#results").innerHTML = (hits.length ? '<div class="hint">' + hits.length + "개 조문</div>" : '<div class="empty">찾는 조문이 없습니다. 다른 낱말로 검색해 보세요.</div>') +
      shown.map((a) => '<details class="item"><summary><span class="lawtag">' + esc(a.law.short) + '</span><span class="no">' + esc(a.no) + '</span><span class="t">' + hl(a.title) + pendTag(a) + "</span>" + lamps(a.id) + "</summary>" +
        '<div class="arttext" style="padding-top:8px">' + a.lines.map((l) => '<p class="' + (subLine(l) ? "sub" : "") + '">' + figs(hl(l)) + "</p>").join("") + "</div>" + explainBox(a.key) +
        (candidates(a).length ? '<div class="row" style="padding-top:8px"><button class="btn small" data-quiz="' + esc(a.id) + '">이 조문으로 문제 풀기</button></div>' : "") + "</details>").join("") +
      (hits.length > shown.length ? '<button class="btn" id="more">더 보기 (' + (hits.length - shown.length) + "개 남음)</button>" : "");
  }
  let searchTimer = null;
  $("#q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { browseLimit = 40; renderBrowse(); }, 150); });
  $("#p-browse").addEventListener("click", (e) => {
    if (e.target.closest("#more")) { browseLimit += 40; renderBrowse(); return; }
    const lw = e.target.closest("[data-law]");
    if (lw) { toggleLaw(lw.dataset.law); browseLimit = 40; renderBrowse(); return; }
    const b = e.target.closest("[data-quiz]");
    if (b) quizOn(b.dataset.quiz);
  });
  function quizOn(id) {
    const it = BYID[id];
    if (!it) return;
    if (!active.has(it.law.id)) { active.add(it.law.id); S.laws = [...active]; }
    if (S.scope !== "all" && !st(id)) S.scope = "all";
    forced = it; show("quiz", true); nextQuiz();
  }

  // ---------- 내 기록 ----------
  let confirmReset = false;
  function renderStats() {
    const rows = LAWS.map((law) => {
      const items = ARTS.filter((a) => a.law === law).concat(TERMS.filter((t) => t.law === law));
      let r = 0, w = 0, seen = 0;
      items.forEach((x) => { const s = st(x.id); if (s) { seen++; r += s.r; w += s.w; } });
      const us = UNITS.filter((u) => u.law === law);
      return { law, seen, total: items.length, acc: r + w ? Math.round((r / (r + w)) * 100) : null, ud: us.filter(unitDone).length, ut: us.length };
    });
    const d = S.days[dayKey(now())] || [0, 0];
    let streak = 0;
    for (let i = 0; i < 400; i++) { if (S.days[dayKey(now() - i * DAY)]) streak++; else if (i > 0) break; }
    const all = ARTS.concat(TERMS);
    const weak = all.filter((x) => st(x.id) && st(x.id).w > 0).sort((x, y) => (st(y.id).w - st(y.id).r * 0.5) - (st(x.id).w - st(x.id).r * 0.5)).slice(0, 10);
    $("#p-stats").innerHTML =
      '<div class="tiles"><div class="tile"><span class="lbl">오늘 푼 문제</span><span class="big">' + d[0] + '</span></div><div class="tile"><span class="lbl">오늘 정답률</span><span class="big">' + (d[0] ? Math.round((d[1] / d[0]) * 100) + "%" : "–") + '</span></div><div class="tile"><span class="lbl">연속 공부</span><span class="big">' + streak + "일</span></div></div>" +
      '<div class="card"><h2>법령별 진도와 정답률</h2><div class="hint">세로선은 과락선 60점입니다. 철도 관련 법은 60점 미만이면 과락입니다.</div><div class="stats">' +
      rows.map((x) => '<div class="lawstat"><div class="head"><span>' + esc(x.law.short) + '</span><span class="num">단원 ' + x.ud + "/" + x.ut + " · 정답률 " + (x.acc === null ? "–" : x.acc + "%") + '</span></div><div class="bar"><div class="fill ' + (x.acc === null ? "" : x.acc >= 60 ? "pass" : "fail") + '" style="width:' + (x.acc || 0) + '%"></div><div class="cut"></div></div></div>').join("") +
      "</div></div>" +
      '<div class="card"><h2>자주 틀린 것</h2>' +
      (weak.length ? '<div class="weak">' + weak.map((x) => '<div class="w"><span><span class="lawtag">' + esc(x.law.short) + "</span> " + (x.kind === "term" ? "용어 · " + esc(x.term) : esc(x.no) + " " + esc(x.title)) + '</span><span class="row"><span class="cnt">틀림 ' + st(x.id).w + " · 맞힘 " + st(x.id).r + '</span><button class="btn small" data-quiz="' + esc(x.id) + '">다시 풀기</button></span></div>').join("") + "</div>"
        : '<div class="empty">아직 틀린 것이 없습니다. 배우기와 복습 퀴즈를 풀면 여기에 쌓입니다.</div>') + "</div>" +
      '<div class="card"><div class="row">' + (confirmReset ? '<span>기록을 모두 지울까요? 되돌릴 수 없습니다.</span><button class="btn bad small" id="reset-yes">모두 지우기</button><button class="btn small" id="reset-no">취소</button>' : '<button class="btn small" id="reset">기록 초기화</button>') + "</div></div>";
  }
  $("#p-stats").addEventListener("click", (e) => {
    const b = e.target.closest("[data-quiz]");
    if (b) { quizOn(b.dataset.quiz); return; }
    if (e.target.closest("#reset")) { confirmReset = true; renderStats(); }
    else if (e.target.closest("#reset-no")) { confirmReset = false; renderStats(); }
    else if (e.target.closest("#reset-yes")) { confirmReset = false; const keep = { laws: S.laws, scope: S.scope }; S = Object.assign(blank(), keep); touch(); renderToday(); renderStats(); }
  });

  // ---------- 공통 ----------
  let tab = "learn";
  function show(t, keep) {
    tab = t;
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    ["learn", "quiz", "browse", "stats"].forEach((k) => ($("#p-" + k).hidden = k !== t));
    if (keep) return;
    if (t === "learn") { if (L) renderStep(); else renderLearnHome(); }
    if (t === "quiz") { if (!Q || Q.picked !== null) nextQuiz(); else renderQuiz(); }
    if (t === "browse") renderBrowse();
    if (t === "stats") renderStats();
  }
  function rerender() { active = new Set(S.laws && S.laws.length ? S.laws : LAWS.map((x) => x.id)); renderToday(); show(tab); }
  document.querySelector("nav.tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); });
  function renderToday() { const d = S.days[dayKey(now())] || [0, 0]; $("#today").textContent = "오늘 " + d[0] + "문제 · 정답 " + d[1]; }
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (tab === "learn" && L) {
      const s = L.steps[L.i];
      if ((s.t === "q" || s.t === "tq") && L.picked === null && /^[1-4]$/.test(e.key)) { e.preventDefault(); lessonAnswer(+e.key - 1); }
      else if (e.key === "Enter" && (s.t === "read" || s.t === "term" || L.picked !== null) && s.t !== "done") { e.preventDefault(); lessonNext(); }
    } else if (tab === "quiz" && Q) {
      if (Q.picked === null && /^[1-4]$/.test(e.key)) { e.preventDefault(); quizAnswer(+e.key - 1); }
      else if (Q.picked !== null && e.key === "Enter") { e.preventDefault(); nextQuiz(); }
    }
  });

  fetch("data.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((data) => {
    LAWS = data.laws;
    LAWS.forEach((law) => {
      LAWBY[law.id] = law;
      law.list = law.arts.map(([no, title, lines, key, pending]) => {
        const a = { kind: "art", id: law.id + ":" + no, key, law, no, title, lines, pending };
        ARTS.push(a); BYID[a.id] = a; KEYMAP[key] = a;
        return a;
      });
    });
    data.units.forEach((u) => {
      const law = LAWBY[u.law];
      const unit = { id: u.id, law, kind: u.kind, title: u.title, sub: u.sub };
      if (u.kind === "terms") unit.terms = u.terms.map(([term, def, ai], n) => {
        const t = { kind: "term", id: "term:" + law.id + ":" + term, key: u.id + "-" + (n + 1), law, term, def, art: law.list[ai] };
        TERMS.push(t); BYID[t.id] = t; KEYMAP[t.key] = t;
        return t;
      });
      else unit.arts = u.arts.map((i) => law.list[i]);
      UNITS.push(unit); UNITBY[u.id] = unit;
    });
    COURSE = data.course;
    FIG = data.figs || {};
    ARTS.forEach((a) => candidates(a).forEach((c) => { if (c.grp.startsWith("n:") || c.grp === "frac") (NUMPOOL[c.grp] = NUMPOOL[c.grp] || new Set()).add(c.ans.replace(/\s+/g, "")); }));
    rerender();
    connectDb();
    if (window.claude && window.claude.use) window.claude.use("sample").then((s) => { if (s) { SAMPLE = s; if (tab === "learn") show("learn"); } }).catch(() => {});
  }).catch(() => {
    $("#p-learn").innerHTML = '<div class="card"><div class="empty">법령 원문을 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div></div>';
  });
})();
</script>
