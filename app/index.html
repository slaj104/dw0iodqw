<title>2종 철도법 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 한 열짜리 학습 앱. 위에 고정 탭, 가운데 문제 카드 하나, 아래로 해설 */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --ink: #15202B;
  --muted: #5B6875;
  --line: #D5DCE4;
  --accent: #1B5FAA;
  --accent-soft: #E1EBF7;
  --good: #1D7A4C;
  --good-soft: #DFF2E8;
  --bad: #C2182B;
  --bad-soft: #FBE3E6;
  --warn: #A86400;
  --warn-soft: #FBEFD9;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --surface: #18202A; --ink: #E6ECF2; --muted: #95A3B1; --line: #2A3542;
    --accent: #78AEFF; --accent-soft: #1C2D45; --good: #4CC38A; --good-soft: #15322A;
    --bad: #FF7A7A; --bad-soft: #3A1D22; --warn: #F2B04C; --warn-soft: #3A2C14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --surface: #18202A; --ink: #E6ECF2; --muted: #95A3B1; --line: #2A3542;
  --accent: #78AEFF; --accent-soft: #1C2D45; --good: #4CC38A; --good-soft: #15322A;
  --bad: #FF7A7A; --bad-soft: #3A1D22; --warn: #F2B04C; --warn-soft: #3A2C14;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px 8px; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 0.8rem; }
.today { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 0 8px; }
nav.tabs button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 12px 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 0.82rem; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 600; }

.panel { padding-block: 12px; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.ref { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 0.82rem; color: var(--muted); }
.ref .law { font-weight: 700; color: var(--accent); }
.ref .no { font-family: var(--f-mono); color: var(--ink); }
.lamps { display: inline-flex; gap: 3px; margin-left: auto; }
.lamps i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.lamps i.on { background: var(--good); }
.lead { color: var(--muted); font-size: 0.88rem; border-left: 2px solid var(--line); padding-left: 10px; }
.q { font-size: 1.05rem; line-height: 1.75; word-break: keep-all; overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 4.5em; text-align: center; border-bottom: 2px solid var(--accent); color: var(--accent); font-weight: 700; padding: 0 4px; }
.blank.ok { color: var(--good); border-color: var(--good); }
.blank.no { color: var(--bad); border-color: var(--bad); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 420px) { .choices { grid-template-columns: 1fr; } }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 13px; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.choice .k { font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.ok { border-color: var(--good); background: var(--good-soft); }
.choice.no { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; }
.verdict { font-weight: 700; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 0.82rem; }
.hint { color: var(--muted); font-size: 0.8rem; }
details.full summary { color: var(--muted); font-size: 0.85rem; cursor: pointer; }
.arttext { display: grid; gap: 6px; font-size: 0.92rem; padding-top: 8px; word-break: keep-all; overflow-wrap: anywhere; }
.arttext p { margin: 0; }
mark { background: var(--warn-soft); color: inherit; border-radius: 3px; padding: 0 2px; }

.cardface { display: grid; gap: 6px; padding-block: 18px; text-align: center; }
.cardface .no { font-family: var(--f-mono); color: var(--muted); }
.cardface .title { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.3; text-wrap: balance; }

.search { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: inherit; }
.list { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.item summary { display: flex; gap: 8px; align-items: center; cursor: pointer; list-style: none; flex-wrap: wrap; }
.item summary::-webkit-details-marker { display: none; }
.item .no { font-family: var(--f-mono); font-size: 0.85rem; }
.item .t { font-weight: 600; min-width: 0; }
.item .lawtag { font-size: 0.72rem; color: var(--accent); font-weight: 700; }

.stats { display: grid; gap: 10px; }
.lawstat { display: grid; gap: 6px; }
.lawstat .head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.9rem; }
.lawstat .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.82rem; }
.bar { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar .fill.pass { background: var(--good); }
.bar .fill.fail { background: var(--bad); }
.bar .cut { position: absolute; top: -2px; bottom: -2px; left: 60%; width: 2px; background: var(--ink); opacity: 0.55; }
.big { font-family: var(--f-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
.tile .lbl { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.02em; }
.weak { display: grid; gap: 6px; }
.weak .w { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 6px; font-size: 0.88rem; }
.w .cnt { font-family: var(--f-mono); color: var(--bad); font-size: 0.8rem; }
h2 { font-size: 1rem; margin: 0; }
.empty { color: var(--muted); text-align: center; padding: 28px 8px; }
.save { font-size: 0.75rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .choice, .chip, .btn { transition: background-color .15s, border-color .15s; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>2종 철도법 암기장</h1>
        <div class="sub">제2종 전기차량 운전면허 필기 · 철도 관련 법 (과락 60점)</div>
      </div>
      <div class="today" id="today">오늘 0문제</div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-quiz" aria-selected="true" data-tab="quiz">빈칸 퀴즈</button>
      <button role="tab" id="tab-card" aria-selected="false" data-tab="card">암기카드</button>
      <button role="tab" id="tab-browse" aria-selected="false" data-tab="browse">조문 찾기</button>
      <button role="tab" id="tab-stats" aria-selected="false" data-tab="stats">내 기록</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="chips" id="chips" aria-label="공부할 법령"></div>
  <section class="panel" id="p-quiz"><div class="card"><div class="empty">법령 원문을 불러오는 중입니다.</div></div></section>
  <section class="panel" id="p-card" hidden></section>
  <section class="panel" id="p-browse" hidden>
    <input class="search" id="q" type="search" placeholder="조문 번호, 제목, 내용 검색 (예: 제10조, 폐색, 과태료)" autocomplete="off">
    <div class="list" id="results"></div>
  </section>
  <section class="panel" id="p-stats" hidden></section>
  <div class="save" id="save"></div>
</main>

<script>
(function () {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const now = () => Date.now();
  const MIN = 60e3, DAY = 864e5;
  const INTERVAL = [2 * MIN, 10 * MIN, DAY, 3 * DAY, 7 * DAY, 16 * DAY];
  const LS_KEY = "rail2-progress-v1";

  // ---------- 진도 상태 ----------
  // arts[id] = {b: 단계 0-5, d: 다음 복습 시각, r: 맞힘, w: 틀림, t: 마지막}
  let S = { v: 1, u: 0, arts: {}, log: [], days: {}, laws: null };
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { return null; } }
  function lsSet() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
  const cached = lsGet();
  if (cached && cached.arts) S = Object.assign(S, cached);

  let dbRef = null, saving = false, dirty = false, saveTimer = null;
  function setSaveNote(t) { $("#save").textContent = t; }
  function touch() {
    S.u = now();
    lsSet();
    if (!dbRef) return;
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 1500);
  }
  async function flush() {
    if (!dbRef || saving || !dirty) return;
    saving = true; dirty = false;
    try { await dbRef.set(JSON.parse(JSON.stringify(S))); setSaveNote("기록이 클라우드에 저장됩니다."); }
    catch (e) {
      if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { dbRef = null; setSaveNote("기록은 이 기기에만 저장됩니다."); }
      else dirty = true;
    }
    saving = false;
    if (dirty) saveTimer = setTimeout(flush, 3000);
  }
  async function connectDb() {
    setSaveNote("기록은 이 기기에만 저장됩니다.");
    try {
      if (!window.claude || !window.claude.use) return;
      const user = await window.claude.use("user");
      const owner = user ? await user.isOwner() : false;
      if (!owner) return;
      const db = await window.claude.use("db");
      if (!db) return;
      const ref = db.doc("progress/main");
      const snap = await ref.get();
      if (snap.exists) {
        const remote = snap.data();
        if (remote && remote.arts && (remote.u || 0) > (S.u || 0)) {
          S = Object.assign({ v: 1, u: 0, arts: {}, log: [], days: {}, laws: null }, JSON.parse(JSON.stringify(remote)));
          lsSet();
          applyLawFilter(); renderChips(); refresh();
        }
      }
      dbRef = ref;
      setSaveNote("기록이 클라우드에 저장됩니다.");
      if (!snap.exists || (S.u || 0) > ((snap.data() || {}).u || 0)) { dirty = true; flush(); }
    } catch (e) { /* 기기 저장으로 계속 */ }
  }

  // ---------- 데이터 ----------
  let LAWS = [], ARTS = [], BYID = {};
  let active = new Set();
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  // ---------- 빈칸 후보 ----------
  const NUM = /(?<![제\d,.])\d[\d,]*(?:\.\d+)?(?:\s?(?:억|천만|백만|만|천|백))*\s?(?:원|년|개월|일|시간|분(?!의)|초|킬로미터|미터|밀리미터|센티미터|퍼센트|%|점|명|회|세|배|량|톤|킬로그램|볼트)/g;
  const FRAC = /\d+분의\s?\d+/g;
  const CMP = ["이상", "이하", "초과", "미만"];
  const GROUPS = {
    ord: { w: 2, words: ["대통령령", "국토교통부령"], fake: ["총리령", "국토교통부 고시", "법률"] },
    auth: { w: 1, words: ["국토교통부장관", "시ㆍ도지사", "철도운영자등", "철도시설관리자", "한국교통안전공단", "도시철도운영자", "운전업무종사자", "관제사", "역장", "기관사"] },
    block: { w: 3, words: ["자동폐색식", "차내신호폐색식", "연동폐색식", "통표폐색식", "지도통신식", "지도식", "전령법", "격시법", "통신식", "지령식"] },
    sig: { w: 3, words: ["정지신호", "경계신호", "주의신호", "감속신호", "진행신호", "유도신호", "입환신호"] },
    sigdev: { w: 3, words: ["장내신호기", "출발신호기", "폐색신호기", "엄호신호기", "유도신호기", "입환신호기", "원방신호기", "통과신호기", "중계신호기"] },
  };
  const WORD2GRP = {};
  Object.keys(GROUPS).forEach((g) => GROUPS[g].words.forEach((w) => (WORD2GRP[w] = g)));
  const WORDRE = new RegExp(Object.keys(WORD2GRP).sort((a, b) => b.length - a.length).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  const MULT = /억|천만|백만|만|천|백/;
  function unitOf(tok) {
    const u = tok.replace(/[\d,.\s]/g, "");
    return /원$/.test(u) ? "money" : u.replace(/^(억|천만|백만|만|천|백)+/, "");
  }
  const NUMPOOL = {};
  function candidates(a) {
    if (a.cands) return a.cands;
    const out = [];
    a.lines.forEach((l, li) => {
      let m;
      NUM.lastIndex = 0;
      while ((m = NUM.exec(l))) {
        const tok = m[0];
        out.push({ li, s: m.index, e: m.index + tok.length, ans: tok, grp: "n:" + unitOf(tok), w: 3 });
        const rest = l.slice(m.index + tok.length);
        const c = rest.match(/^\s?(이상|이하|초과|미만)/);
        if (c) { const s = m.index + tok.length + c[0].indexOf(c[1]); out.push({ li, s, e: s + c[1].length, ans: c[1], grp: "cmp", w: 2 }); }
      }
      FRAC.lastIndex = 0;
      while ((m = FRAC.exec(l))) out.push({ li, s: m.index, e: m.index + m[0].length, ans: m[0], grp: "frac", w: 3 });
      WORDRE.lastIndex = 0;
      while ((m = WORDRE.exec(l))) { const g = WORD2GRP[m[0]]; out.push({ li, s: m.index, e: m.index + m[0].length, ans: m[0], grp: g, w: GROUPS[g].w }); }
    });
    a.cands = out;
    return out;
  }
  function buildPools() {
    ARTS.forEach((a) => candidates(a).forEach((c) => {
      if (c.grp.startsWith("n:") || c.grp === "frac") (NUMPOOL[c.grp] = NUMPOOL[c.grp] || new Set()).add(c.ans.replace(/\s+/g, ""));
    }));
  }
  const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  function numVariants(ans) {
    const m = ans.match(/^(\d+)(.*)$/);
    if (!m) return [];
    const n = parseInt(m[1], 10), suf = m[2];
    return [n * 2, n + 1, n - 1, n * 3, Math.round(n / 2), n + 2, n * 10, n + 5].filter((x) => x > 0 && x !== n).map((x) => x + suf);
  }
  function distractors(c) {
    const ans = c.ans.replace(/\s+/g, "");
    let pool = [];
    if (c.grp === "cmp") pool = CMP.filter((x) => x !== c.ans);
    else if (GROUPS[c.grp]) pool = shuffle(GROUPS[c.grp].words.concat(GROUPS[c.grp].fake || []).filter((x) => x !== c.ans));
    else {
      pool = shuffle([...(NUMPOOL[c.grp] || [])].filter((x) => x !== ans));
      if (pool.length < 3) pool = pool.concat(shuffle(numVariants(ans)).filter((x) => !pool.includes(x)));
    }
    return pool.slice(0, 3);
  }

  // ---------- 복습 일정 ----------
  const st = (id) => S.arts[id] || null;
  function pickArticle(pool, avoid) {
    const t = now();
    const list = pool.filter((a) => a.id !== avoid);
    if (!list.length) return pool[0] || null;
    const due = list.filter((a) => st(a.id) && st(a.id).d <= t).sort((x, y) => st(x.id).b - st(y.id).b || st(x.id).d - st(y.id).d);
    if (due.length) return due[0];
    const fresh = list.filter((a) => !st(a.id));
    if (fresh.length) return fresh[Math.floor(Math.random() * fresh.length)];
    return list.slice().sort((x, y) => st(x.id).d - st(y.id).d)[0];
  }
  function grade(a, result, kind, tok) {
    const s = S.arts[a.id] || { b: 0, d: 0, r: 0, w: 0, t: 0 };
    if (result === "ok") { s.b = Math.min(5, s.b + 1); s.r++; }
    else if (result === "no") { s.b = 0; s.w++; }
    s.d = now() + (result === "mid" ? 10 * MIN : INTERVAL[s.b]);
    s.t = now();
    S.arts[a.id] = s;
    const d = today();
    const day = S.days[d] || [0, 0];
    day[0]++; if (result === "ok") day[1]++;
    S.days[d] = day;
    S.log.push([now(), a.id, kind, result === "ok" ? 1 : result === "no" ? 0 : 0.5, tok || ""]);
    if (S.log.length > 400) S.log = S.log.slice(-400);
    touch();
    renderToday();
  }
  function lamps(id) {
    const b = st(id) ? st(id).b : 0;
    let h = '<span class="lamps" title="외운 단계 ' + b + '/5">';
    for (let i = 1; i <= 5; i++) h += '<i class="' + (i <= b ? "on" : "") + '"></i>';
    return h + "</span>";
  }
  function refHtml(a) {
    return '<div class="ref"><span class="law">' + esc(a.law.short) + '</span><span class="no">' + esc(a.no) + "</span><span>" + esc(a.title) + "</span>" + lamps(a.id) + "</div>";
  }
  function fullText(a, hl) {
    return '<div class="arttext">' + a.lines.map((l, i) => "<p>" + (hl && hl.li === i ? esc(l.slice(0, hl.s)) + "<mark>" + esc(l.slice(hl.s, hl.e)) + "</mark>" + esc(l.slice(hl.e)) : esc(l)) + "</p>").join("") + "</div>";
  }
  function pool() { return ARTS.filter((a) => active.has(a.law.id)); }

  // ---------- 빈칸 퀴즈 ----------
  let Q = null, lastQuizArt = null, forced = null;
  function nextQuiz() {
    const p = pool().filter((a) => candidates(a).length);
    const box = $("#p-quiz");
    if (!p.length) { box.innerHTML = '<div class="card"><div class="empty">고른 법령에 빈칸 문제를 만들 조문이 없습니다. 위에서 법령을 더 골라 주세요.</div></div>'; return; }
    let a = forced && p.includes(forced) ? forced : pickArticle(p, lastQuizArt);
    forced = null;
    lastQuizArt = a.id;
    const cs = candidates(a);
    let total = cs.reduce((n, c) => n + c.w, 0), r = Math.random() * total, c = cs[0];
    for (const x of cs) { r -= x.w; if (r <= 0) { c = x; break; } }
    const opts = shuffle([c.ans].concat(distractors(c)));
    Q = { a, c, opts, done: false };
    renderQuiz();
  }
  function renderQuiz(pickedIdx) {
    const { a, c, opts, done } = Q;
    const line = a.lines[c.li];
    let blank = '<span class="blank">( ? )</span>';
    let verdict = "";
    if (done) {
      const ok = opts[pickedIdx] === c.ans;
      blank = '<span class="blank ' + (ok ? "ok" : "no") + '">' + esc(c.ans) + "</span>";
      verdict = '<div class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "정답입니다." : "틀렸습니다. 정답은 ‘" + esc(c.ans) + "’입니다.") + "</div>";
    }
    const lead = c.li > 0 ? '<div class="lead">' + esc(a.lines[0].length > 120 ? a.lines[0].slice(0, 120) + "…" : a.lines[0]) + "</div>" : "";
    const choices = opts.map((o, i) => {
      let cls = "choice";
      if (done && o === c.ans) cls += " ok";
      else if (done && i === pickedIdx) cls += " no";
      return '<button class="' + cls + '" data-i="' + i + '"' + (done ? " disabled" : "") + '><span class="k">' + (i + 1) + "</span><span>" + esc(o) + "</span></button>";
    }).join("");
    $("#p-quiz").innerHTML =
      '<div class="card">' + refHtml(a) + lead +
      '<div class="q">' + esc(line.slice(0, c.s)) + blank + esc(line.slice(c.e)) + "</div>" +
      '<div class="choices">' + choices + "</div>" + verdict +
      (done ? '<details class="full"><summary>조문 전체 보기</summary>' + fullText(a, c) + "</details>" +
        '<div class="row"><button class="btn primary" id="next">다음 문제</button><span class="hint">Enter 키로 넘어갑니다</span></div>'
        : '<div class="hint">숫자 키 1–4로도 고를 수 있습니다.</div>') +
      "</div>";
  }
  function answerQuiz(i) {
    if (!Q || Q.done) return;
    Q.done = true;
    const ok = Q.opts[i] === Q.c.ans;
    grade(Q.a, ok ? "ok" : "no", "q", Q.c.ans);
    renderQuiz(i);
    const n = $("#next"); if (n) n.focus();
  }
  $("#p-quiz").addEventListener("click", (e) => {
    const b = e.target.closest(".choice");
    if (b) answerQuiz(+b.dataset.i);
    if (e.target.closest("#next")) nextQuiz();
  });

  // ---------- 암기카드 ----------
  let C = null, lastCardArt = null;
  function nextCard() {
    const p = pool();
    if (!p.length) { $("#p-card").innerHTML = '<div class="card"><div class="empty">위에서 공부할 법령을 골라 주세요.</div></div>'; return; }
    const a = pickArticle(p, lastCardArt);
    lastCardArt = a.id;
    C = { a, open: false };
    renderCard();
  }
  function renderCard() {
    const { a, open } = C;
    $("#p-card").innerHTML =
      '<div class="card">' + refHtml(a) +
      '<div class="cardface"><div class="no">' + esc(a.law.short) + " " + esc(a.no) + '</div><div class="title">' + esc(a.title || "(제목 없음)") + "</div>" +
      (open ? "" : '<div class="hint">내용을 떠올려 본 다음 펼쳐 보세요.</div>') + "</div>" +
      (open ? fullText(a) +
        '<div class="row"><button class="btn bad" data-g="no">몰랐어요</button><button class="btn warn" data-g="mid">헷갈려요</button><button class="btn good" data-g="ok">외웠어요</button></div>'
        : '<div class="row"><button class="btn primary" id="flip">내용 보기</button><span class="hint">Space 키로 펼칩니다</span></div>') +
      "</div>";
  }
  $("#p-card").addEventListener("click", (e) => {
    if (e.target.closest("#flip")) { C.open = true; renderCard(); return; }
    const g = e.target.closest("[data-g]");
    if (g) { grade(C.a, g.dataset.g, "c"); nextCard(); }
  });

  // ---------- 조문 찾기 ----------
  let browseLimit = 40;
  function renderBrowse() {
    const q = $("#q").value.trim();
    const p = pool();
    const norm = (s) => s.replace(/\s+/g, "");
    const nq = norm(q);
    const hits = !q ? p : p.filter((a) => norm(a.no + a.title).includes(nq) || a.lines.some((l) => norm(l).includes(nq)));
    const shown = hits.slice(0, browseLimit);
    const hl = (s) => {
      if (!q) return esc(s);
      const i = s.indexOf(q);
      return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(q) + "</mark>" + esc(s.slice(i + q.length));
    };
    $("#results").innerHTML = (hits.length ? '<div class="hint">' + hits.length + "개 조문</div>" : '<div class="empty">찾는 조문이 없습니다. 다른 낱말로 검색해 보세요.</div>') +
      shown.map((a) => '<details class="item"><summary><span class="lawtag">' + esc(a.law.short) + '</span><span class="no">' + esc(a.no) + '</span><span class="t">' + hl(a.title) + "</span>" + lamps(a.id) + "</summary>" +
        '<div class="arttext">' + a.lines.map((l) => "<p>" + hl(l) + "</p>").join("") + "</div>" +
        '<div class="row" style="padding-top:8px"><button class="btn small" data-quiz="' + esc(a.id) + '">이 조문으로 퀴즈</button></div></details>').join("") +
      (hits.length > shown.length ? '<button class="btn" id="more">더 보기 (' + (hits.length - shown.length) + "개 남음)</button>" : "");
  }
  let searchTimer = null;
  $("#q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { browseLimit = 40; renderBrowse(); }, 150); });
  $("#results").addEventListener("click", (e) => {
    if (e.target.closest("#more")) { browseLimit += 40; renderBrowse(); return; }
    const b = e.target.closest("[data-quiz]");
    if (b) quizOn(b.dataset.quiz);
  });
  function quizOn(id) {
    const a = BYID[id];
    if (!a) return;
    if (!candidates(a).length) { alertInline("이 조문에는 빈칸으로 낼 숫자나 용어가 없어 암기카드로 엽니다."); C = { a, open: false }; show("card", true); renderCard(); return; }
    forced = a; show("quiz", true); nextQuiz();
  }
  function alertInline(t) { setSaveNote(t); setTimeout(() => setSaveNote(dbRef ? "기록이 클라우드에 저장됩니다." : "기록은 이 기기에만 저장됩니다."), 4000); }

  // ---------- 내 기록 ----------
  let confirmReset = false;
  function renderStats() {
    const rows = LAWS.map((L) => {
      const arts = ARTS.filter((a) => a.law.id === L.id);
      let seen = 0, r = 0, w = 0, mastered = 0;
      arts.forEach((a) => { const s = st(a.id); if (s) { seen++; r += s.r; w += s.w; if (s.b >= 3) mastered++; } });
      const acc = r + w ? Math.round((r / (r + w)) * 100) : null;
      return { L, total: arts.length, seen, mastered, acc };
    });
    const d = S.days[today()] || [0, 0];
    let streak = 0;
    for (let i = 0; ; i++) { const t = new Date(now() - i * DAY); const k = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); if (S.days[k]) streak++; else if (i > 0) break; if (i > 400) break; }
    const dueCount = ARTS.filter((a) => st(a.id) && st(a.id).d <= now()).length;
    const weak = ARTS.filter((a) => st(a.id) && st(a.id).w > 0).sort((x, y) => (st(y.id).w - st(y.id).r * 0.5) - (st(x.id).w - st(x.id).r * 0.5)).slice(0, 10);
    $("#p-stats").innerHTML =
      '<div class="tiles">' +
      '<div class="tile"><span class="lbl">오늘 푼 문제</span><span class="big">' + d[0] + "</span></div>" +
      '<div class="tile"><span class="lbl">오늘 정답률</span><span class="big">' + (d[0] ? Math.round((d[1] / d[0]) * 100) + "%" : "–") + "</span></div>" +
      '<div class="tile"><span class="lbl">연속 공부</span><span class="big">' + streak + "일</span></div></div>" +
      '<div class="card"><h2>법령별 정답률</h2><div class="hint">세로선이 과락선 60점입니다. 철도 관련 법은 60점 미만이면 과락입니다.</div><div class="stats">' +
      rows.map((x) => '<div class="lawstat"><div class="head"><span>' + esc(x.L.short) + '</span><span class="num">본 조문 ' + x.seen + "/" + x.total + " · 3단계 이상 " + x.mastered + " · 정답률 " + (x.acc === null ? "–" : x.acc + "%") + '</span></div><div class="bar"><div class="fill ' + (x.acc === null ? "" : x.acc >= 60 ? "pass" : "fail") + '" style="width:' + (x.acc || 0) + '%"></div><div class="cut"></div></div></div>').join("") +
      "</div></div>" +
      '<div class="card"><h2>자주 틀린 조문</h2>' +
      (weak.length ? '<div class="weak">' + weak.map((a) => '<div class="w"><span><span class="lawtag" style="color:var(--accent);font-weight:700;font-size:.75rem">' + esc(a.law.short) + "</span> " + esc(a.no) + " " + esc(a.title) + '</span><span class="row"><span class="cnt">틀림 ' + st(a.id).w + " · 맞힘 " + st(a.id).r + '</span><button class="btn small" data-quiz="' + esc(a.id) + '">다시 풀기</button></span></div>').join("") + "</div>"
        : '<div class="empty">아직 틀린 조문이 없습니다. 빈칸 퀴즈를 풀면 여기에 쌓입니다.</div>') +
      "</div>" +
      '<div class="card"><div class="hint">지금 복습할 조문 ' + dueCount + "개 · 기록 " + Object.keys(S.arts).length + '개 조문</div><div class="row">' +
      (confirmReset ? '<span>기록을 모두 지울까요? 되돌릴 수 없습니다.</span><button class="btn bad small" id="reset-yes">모두 지우기</button><button class="btn small" id="reset-no">취소</button>'
        : '<button class="btn small" id="reset">기록 초기화</button>') + "</div></div>";
  }
  $("#p-stats").addEventListener("click", (e) => {
    const b = e.target.closest("[data-quiz]");
    if (b) { quizOn(b.dataset.quiz); return; }
    if (e.target.closest("#reset")) { confirmReset = true; renderStats(); }
    else if (e.target.closest("#reset-no")) { confirmReset = false; renderStats(); }
    else if (e.target.closest("#reset-yes")) { confirmReset = false; S.arts = {}; S.log = []; S.days = {}; touch(); renderToday(); renderStats(); }
  });

  // ---------- 공통 ----------
  let tab = "quiz";
  function show(t, keep) {
    tab = t;
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    ["quiz", "card", "browse", "stats"].forEach((k) => ($("#p-" + k).hidden = k !== t));
    if (keep) return;
    if (t === "quiz" && (!Q || Q.done)) nextQuiz();
    if (t === "card" && !C) nextCard();
    if (t === "browse") renderBrowse();
    if (t === "stats") renderStats();
  }
  document.querySelector("nav.tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) show(b.dataset.tab); });
  function renderToday() { const d = S.days[today()] || [0, 0]; $("#today").textContent = "오늘 " + d[0] + "문제 · 정답 " + d[1]; }
  function applyLawFilter() { active = new Set(S.laws && S.laws.length ? S.laws : LAWS.map((L) => L.id)); }
  function renderChips() {
    $("#chips").innerHTML = LAWS.map((L) => '<button class="chip" aria-pressed="' + active.has(L.id) + '" data-law="' + L.id + '">' + esc(L.short) + "</button>").join("");
  }
  $("#chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-law]");
    if (!b) return;
    const id = b.dataset.law;
    if (active.has(id)) { if (active.size > 1) active.delete(id); } else active.add(id);
    S.laws = [...active];
    touch();
    renderChips();
    Q = null; C = null;
    refresh();
  });
  function refresh() {
    if (tab === "quiz") { if (!Q || Q.done || !active.has(Q.a.law.id)) nextQuiz(); else renderQuiz(); }
    else if (tab === "card") { if (!C || !active.has(C.a.law.id)) nextCard(); else renderCard(); }
    else if (tab === "browse") renderBrowse();
    else renderStats();
    renderToday();
  }
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (tab === "quiz" && Q) {
      if (!Q.done && /^[1-4]$/.test(e.key)) { e.preventDefault(); answerQuiz(+e.key - 1); }
      else if (Q.done && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nextQuiz(); }
    } else if (tab === "card" && C) {
      if (!C.open && (e.key === " " || e.key === "Enter")) { e.preventDefault(); C.open = true; renderCard(); }
      else if (C.open && /^[1-3]$/.test(e.key)) { grade(C.a, ["no", "mid", "ok"][+e.key - 1], "c"); nextCard(); }
    }
  });

  fetch("data.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((data) => {
    LAWS = data.laws;
    LAWS.forEach((L) => L.arts.forEach(([no, title, lines]) => {
      const a = { id: L.id + ":" + no, law: L, no, title, lines };
      ARTS.push(a); BYID[a.id] = a;
    }));
    buildPools();
    applyLawFilter();
    renderChips();
    renderToday();
    nextQuiz();
    connectDb();
  }).catch(() => {
    $("#p-quiz").innerHTML = '<div class="card"><div class="empty">법령 원문을 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div></div>';
  });
})();
</script>
